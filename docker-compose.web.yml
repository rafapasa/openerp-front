services:
  openerp-front:
    image: ${DOCKER_USERNAME:-rafapasa}/openerp-front:${IMAGE_TAG:-latest}
    container_name: openerp-front
    hostname: openerp-front
    restart: unless-stopped
    ports:
      # Proxy do host openerp.etoolstec.com.br → esta porta
      - "${WEB_PORT:-8081}:80"
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true
    name: mcp-network
