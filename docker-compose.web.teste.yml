services:
  openerp-front-teste:
    image: ${DOCKER_USERNAME:-rafapasa}/openerp-front:${IMAGE_TAG:-test}
    container_name: openerp-front-teste
    hostname: openerp-front-teste
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8083}:80"
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true
    name: mcp-network
